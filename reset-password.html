<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Reset Password | PYNX</title>
    <link rel="stylesheet" href="css/styles.css?v=password-reset">
    <style>.auth-form[hidden] { display: none; }
        .reset-success-overlay { position: fixed; inset: 0; background: rgba(17, 17, 17, .55); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; opacity: 0; transition: opacity .3s cubic-bezier(.4,0,.2,1); }
        .reset-success-overlay.show { opacity: 1; }
        .reset-success-dialog { background: #fff; color: #111; width: 100%; max-width: 400px; padding: 40px 32px 32px; text-align: center; box-shadow: 0 24px 60px rgba(0, 0, 0, .25); transform: translateY(16px) scale(.97); transition: transform .35s cubic-bezier(.2,.7,.2,1); }
        .reset-success-overlay.show .reset-success-dialog { transform: translateY(0) scale(1); }
        .reset-success-icon { width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 50%; background: #111; color: #fff; display: flex; align-items: center; justify-content: center; }
        .reset-success-icon svg { width: 26px; height: 26px; }
        .reset-success-eyebrow { margin: 0 0 6px; font-size: .72rem; letter-spacing: .18rem; text-transform: uppercase; color: #666; }
        .reset-success-dialog h2 { margin: 0 0 12px; font-family: 'Bebas Neue', Arial, sans-serif; font-size: 2.2rem; font-weight: 400; letter-spacing: .08rem; }
        .reset-success-dialog p { margin: 0 0 26px; color: #444; line-height: 1.6; font-size: .95rem; }
        .reset-success-dialog .btn-primary { width: 100%; }
    </style>
</head>
<body class="customer-auth-page">
<header id="site-header" class="customer-header">
    <a class="logo" href="index.html#home"><img class="header-logo" src="logo/pynx-logo-black.png" alt="PYNX"></a>
</header>
<main class="page-auth customer-auth-page-main">
    <section class="auth-panel customer-auth-panel">
        <div class="auth-inner customer-auth-inner">
            <div class="section-header customer-header-copy">
                <p class="section-eyebrow">Customer Access</p>
                <h1 id="reset-title">Forgot your password?</h1>
                <p class="page-sub" id="reset-description">Enter your account email and we will send a reset link if an account exists.</p>
            </div>
            <form id="request-form" class="auth-form">
                <label for="request-email">Email</label>
                <input id="request-email" type="email" autocomplete="email" maxlength="254" required>
                <button type="submit" class="btn-primary form-submit">Send reset link</button>
            </form>
            <form id="reset-form" class="auth-form" hidden>
                <label for="new-password">New password (6 or more characters)</label>
                <input id="new-password" type="password" autocomplete="new-password" minlength="6" maxlength="200" required>
                <label for="confirm-password">Confirm new password</label>
                <input id="confirm-password" type="password" autocomplete="new-password" minlength="6" maxlength="200" required>
                <button type="submit" class="btn-primary form-submit">Change password</button>
            </form>
            <p class="auth-note" id="reset-note" role="status" aria-live="polite"></p>
            <p class="auth-switch"><a href="login.html">Back to login</a></p>
        </div>
    </section>
</main>
<script src="js/config.js"></script>
<script>
    const token = window.location.hash.slice(1);
    if (token) history.replaceState(null, '', window.location.pathname + window.location.search);
    const requestForm = document.getElementById('request-form');
    const resetForm = document.getElementById('reset-form');
    const note = document.getElementById('reset-note');
    if (token) {
        requestForm.hidden = true;
        resetForm.hidden = false;
        document.getElementById('reset-title').textContent = 'Choose a new password';
        document.getElementById('reset-description').textContent = 'Enter and confirm your new password.';
    }

    async function submitForm(form, path, body) {
        const button = form.querySelector('button');
        button.disabled = true;
        note.classList.remove('error');
        note.textContent = 'Please wait...';
        try {
            const response = await fetch(`${window.PYNX_API_BASE}${path}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
            const result = await response.json();
            if (!response.ok || !result.success) throw new Error(result.message || 'Please try again later.');
            if (form === resetForm) {
                resetForm.reset();
                resetForm.hidden = true;
                showResetSuccess(result);
                return;
            }
            note.textContent = result.message;
        } catch (error) {
            console.error('Password recovery failed:', error);
            note.textContent = error instanceof TypeError || error instanceof SyntaxError
                ? 'Cannot reach the server. Please try again later.' : error.message;
            note.classList.add('error');
        } finally {
            button.disabled = false;
        }
    }
    function showResetSuccess(result) {
        localStorage.setItem('pynx_user', JSON.stringify(result.customer));
        localStorage.setItem('pynx_logged_in', 'true');
        localStorage.setItem('pynx_customer_token', result.token || '');
        localStorage.removeItem('pynx_admin_token');
        const overlay = document.createElement('div');
        overlay.className = 'reset-success-overlay';
        overlay.innerHTML = `
            <div class="reset-success-dialog" role="dialog" aria-modal="true" aria-labelledby="reset-success-title">
                <div class="reset-success-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </div>
                <p class="reset-success-eyebrow">Customer Access</p>
                <h2 id="reset-success-title">Password Reset</h2>
                <p>Your password has been reset successfully and you are now signed in.</p>
                <button type="button" class="btn-primary form-submit">Continue</button>
            </div>`;
        overlay.querySelector('button').addEventListener('click', () => { window.location.href = 'index.html'; });
        document.body.appendChild(overlay);
        requestAnimationFrame(() => overlay.classList.add('show'));
        overlay.querySelector('button').focus();
    }
    requestForm.addEventListener('submit', event => {
        event.preventDefault();
        submitForm(requestForm, '/api/customers/forgot-password', { email: document.getElementById('request-email').value.trim() });
    });
    resetForm.addEventListener('submit', event => {
        event.preventDefault();
        const password = document.getElementById('new-password').value;
        if (password !== document.getElementById('confirm-password').value) {
            note.textContent = 'Passwords do not match.';
            note.classList.add('error');
            return;
        }
        submitForm(resetForm, '/api/customers/reset-password', { token, password });
    });
</script>
<footer><div class="footer-bottom"><p>© 2026 PYNX. All rights reserved.</p></div></footer>
</body>
</html>
