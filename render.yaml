services:
  - type: web
    name: pynx-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@pynx.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: NOTIFY_EMAIL
        value: Contactpynx@gmail.com
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: MONGODB_URI
        sync: false
