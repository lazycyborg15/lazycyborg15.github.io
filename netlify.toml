[build]
  publish = "."
  functions = "netlify/functions"
  command = "echo Static site, no build step"

[build.environment]
  # These are public contact/staff addresses that appear in the site and server defaults.
  SECRETS_SCAN_OMIT_KEYS = "EMAIL_USER,ADMIN_EMAIL,NOTIFY_EMAIL"

[functions]
  node_bundler = "esbuild"

# Keep server code, data files and project metadata out of the public site.
[[redirects]]
  from = "/data/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/server/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/client/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
